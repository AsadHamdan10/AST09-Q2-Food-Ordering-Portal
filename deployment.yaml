
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering-portal
  template:
    metadata:
      labels:
        app: food-ordering-portal
    spec:
      containers:
        - name: food-ordering-portal
          image: asadhamdan10/food-ordering-portal:1.1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-portal-service
spec:
  type: NodePort
  selector:
    app: food-ordering-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
